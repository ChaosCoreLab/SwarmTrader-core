title: SwarmTrader Core
description: Historical ENI replay PoC and ArchiMate architecture documentation
permalink: pretty
baseurl: /SwarmTrader-core
url: https://chaoscorelab.github.io
exclude:
  - ".github"
  - ".cache"
  - ".swhouse"
  - "software-house-ai"
  - "src"
  - "scripts"
  - "tests"
  - "archimate"
  - "node_modules"
  - "package.json"
  - "package-lock.json"
  - "vite.config.js"
  - "playwright.config.js"
  - "README.md"
  - "CLAUDE.md"
  - "tsconfig.json"
  - "index.html"
  - "Gemfile"
  - "Gemfile.lock"
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: home
  - scope:
      path: "docs/architecture"
    values:
      layout: doc
  - scope:
      path: "docs/decisions"
    values:
      layout: doc
  - scope:
      path: "docs/operations"
    values:
      layout: doc
