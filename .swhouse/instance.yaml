# Default instance profile (used when .swhouse/instance.local.yaml is absent).
# Alternative profiles: .swhouse/instances/ — see docs/operations/development.md.
framework_version: "0.1.0"
framework_repo: "https://github.com/simpego81/software-house-ai"

# Project-specific rule, read by agents; the pinned framework does not enforce this field.
project_rules:
  archimate_pr_preview: ".swhouse/policies/archimate-pr-preview.md"
  board_status: ".swhouse/policies/board-status.md"

instance:
  machine: "windows-workstation"
  operator: "U422756"

agents:
  - role: ARCHITECT
    provider: copilot
  - role: EXPLORER
    provider: copilot
  - role: CRITIC
    provider: copilot
  - role: DESTROYER
    provider: copilot
  - role: BUILDER
    provider: copilot
  - role: OPTIMIZER
    provider: copilot
  - role: LIBRARIAN
    provider: copilot
  - role: SCIENTIST
    provider: copilot
  - role: PRODUCT_OWNER
    provider: copilot
  - role: COORDINATOR
    provider: copilot
  - role: EVOLUTION_MASTER
    provider: copilot
  - role: ARBITER
    provider: copilot
